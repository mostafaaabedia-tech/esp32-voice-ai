<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Companion</title>
<style>
  html, body { margin: 0; height: 100%; background: #16123a; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Report problems to the app (shown as a message) instead of a blank screen.
window.onerror = function (msg, src, line) {
  try { if (window.AndroidBridge) AndroidBridge.error(String(msg) + ' (line ' + line + ')'); } catch (e) {}
};
</script>
<script>
// =============================================================================
//  VoiceAI companion avatar - original characters drawn with canvas:
//    'wizard' (Zephyr, a young apprentice wizard) and 'nova' (anime girl).
//  Written in plain ES2015 so it also runs on older Android WebViews.
//  The Android app controls her with window.Avatar.* and gets touches back
//  through AndroidBridge.touch(kind).
// =============================================================================
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const LW = 400, LH = 540;            // drawing space; scaled to fit the view
let SC = 1, OX = 0, OY = 0, DPR = 1;

function resize() {
  DPR = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  SC = Math.min(w / LW, h / LH);
  OX = (w - LW * SC) / 2;
  OY = h - LH * SC;                  // sits on the bottom edge
}
addEventListener('resize', resize);
resize();

// ------------------------------------------------------------------ state ---
const S = {
  emotion: 'neutral',      // set by the app (the AI decides)
  mood: 'neutral',         // what she goes back to after a temporary emotion
  speaking: false, listening: false, thinking: false,
  petting: false,          // a hand on the ESP32 IR sensor
  love: 30, lookX: 0, person: true, sleepy: false,
  hair: '#8e74e6', eyes: '#d9577f', outfit: '#f6f3fd',
  character: 'wizard', hat: '#3b2f8f', robe: '#2b3a8c',
  sky: ['#120e33', '#241d5c', '#45307a'],
};
const STARS = [];
for (let i = 0; i < 46; i++) STARS.push([Math.random(), Math.random(), 0.6 + Math.random() * 2.2, 0.6 + Math.random() * 1.6]);
const A = {                 // animated values
  t: 0, lx: 0, ly: 0, tlx: 0, tly: 0, nextGlance: 1.5,
  blinkAt: 2, blinkT: -1, mouth: 0, tilt: 0, blush: 0.15, brow: 0, browAng: 0,
  open: 1, wordT: -9, emoT: 0, emoUntil: 0, pokeT: -9, tapT: -9, petHand: 0, handX: 200,
  touchPet: false, pointer: null, idleT: 6, idle: '', idleStart: -9, bounce: 0, wispT: 0, ready: false,
};
// characters sit a bit lower so the wizard hat fits
function charOffset() { return S.character === 'wizard' ? 34 : 0; }

// Expressions: eyes, eyebrows, mouth, blush, head tilt, extras
const EX = {
  neutral:  { eyes: 'normal', lift: 0,    ang: 0,    mouth: 'smile', blush: 0.15, tilt: 0 },
  happy:    { eyes: 'normal', lift: 0.35, ang: 0,    mouth: 'grin',  blush: 0.35, tilt: 4 },
  love:     { eyes: 'heart',  lift: 0.3,  ang: 0,    mouth: 'cat',   blush: 0.9,  tilt: 5, fx: 'hearts' },
  shy:      { eyes: 'down',   lift: 0.1,  ang: -0.6, mouth: 'wavy',  blush: 1,    tilt: -7 },
  excited:  { eyes: 'sparkle',lift: 0.7,  ang: 0,    mouth: 'open',  blush: 0.5,  tilt: 0, fx: 'sparkles', bounce: 1 },
  surprised:{ eyes: 'wide',   lift: 1,    ang: 0,    mouth: 'o',     blush: 0.1,  tilt: 0, fx: 'bang' },
  sad:      { eyes: 'normal', lift: -0.2, ang: -1,   mouth: 'frown', blush: 0.1,  tilt: -4, fx: 'tear' },
  angry:    { eyes: 'angry',  lift: -0.3, ang: 1,    mouth: 'pout',  blush: 0.45, tilt: 3, fx: 'anger' },
  sleepy:   { eyes: 'half',   lift: -0.2, ang: -0.3, mouth: 'small', blush: 0.15, tilt: 6, fx: 'zzz' },
  thinking: { eyes: 'up',     lift: 0.3,  ang: -0.3, mouth: 'flat',  blush: 0.1,  tilt: -6, fx: 'dots' },
  laugh:    { eyes: 'closed', lift: 0.5,  ang: 0,    mouth: 'open',  blush: 0.6,  tilt: 6, fx: 'notes', bounce: 1 },
  wink:     { eyes: 'wink',   lift: 0.4,  ang: 0,    mouth: 'tongue',blush: 0.35, tilt: 6, fx: 'sparkles' },
  pout:     { eyes: 'normal', lift: -0.1, ang: 0.6,  mouth: 'puff',  blush: 0.7,  tilt: -3 },
  pet:      { eyes: 'closed', lift: 0.3,  ang: -0.2, mouth: 'cat',   blush: 1,    tilt: 9, fx: 'hearts' },
  listening:{ eyes: 'normal', lift: 0.45, ang: 0,    mouth: 'small', blush: 0.2,  tilt: 7 },
};

// ---------------------------------------------------------------- colours ---
function hexToRgb(h) { h = h.replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; }
function shade(h, k) {        // k < 0 darker, k > 0 lighter
  const c = hexToRgb(h).map(v => k < 0 ? v * (1 + k) : v + (255 - v) * k);
  return `rgb(${c.map(v => Math.round(Math.max(0, Math.min(255, v)))).join(',')})`;
}
function rgba(h, a) { const c = hexToRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
const SKIN = '#ffe6da', SKIN2 = '#f5c9b9', LINE = '#3b2a4d';

// -------------------------------------------------------------- particles ---
const P = [];
function spawn(kind, x, y, vx, vy, life, size, color, gy) {
  if (P.length < 160) P.push({ kind: kind, x: x, y: y, vx: vx, vy: vy, life: life, size: size, color: color || '#fff', gy: gy || 0, age: 0, ph: Math.random() * 6 });
}

function heartPath(x, y, r) {
  g.beginPath();
  g.moveTo(x, y + r * 0.95);
  g.bezierCurveTo(x - r * 1.3, y + r * 0.1, x - r * 1.0, y - r * 0.95, x, y - r * 0.35);
  g.bezierCurveTo(x + r * 1.0, y - r * 0.95, x + r * 1.3, y + r * 0.1, x, y + r * 0.95);
  g.closePath();
}
function star(x, y, r, n = 4, inner = 0.38) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = i * Math.PI / n - Math.PI / 2, rr = i % 2 ? r * inner : r;
    g[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath();
}

function drawParticles(dt) {
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    p.age += dt;
    if (p.age > p.life) { P.splice(i, 1); continue; }
    const k = p.age / p.life, pop = Math.min(1, k / 0.12), fade = 1 - k * k;
    const wob = (p.kind === 'heart' || p.kind === 'note' || p.kind === 'bubble' || p.kind === 'snow') ? Math.sin(p.age * 4 + p.ph) * 6 : 0;
    const x = p.x + p.vx * p.age + wob, y = p.y + p.vy * p.age + 0.5 * p.gy * p.age * p.age;
    g.save();
    g.globalAlpha = fade;
    if (p.kind === 'heart') {
      heartPath(x, y, p.size * pop);
      g.fillStyle = '#ff6f9f'; g.fill();
      g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(x - p.size * 0.35, y - p.size * 0.25, p.size * 0.18, 0, 7); g.fill();
    } else if (p.kind === 'spark') {
      star(x, y, p.size * pop * (1 - k * 0.5)); g.fillStyle = '#fff3b0'; g.fill();
    } else if (p.kind === 'note') {
      g.fillStyle = rgba(S.hair, 1); g.font = `bold ${p.size}px sans-serif`; g.fillText(Math.random() < 0 ? '' : (p.ph > 3 ? '♪' : '♫'), x, y);
    } else if (p.kind === 'z') {
      g.fillStyle = '#9fa8d9'; g.font = `bold ${p.size}px sans-serif`; g.fillText('z', x, y);
    } else if (p.kind === 'gstar') {
      star(x, y, p.size * pop, 5, 0.45); g.fillStyle = '#ffd166'; g.fill();
    } else if (p.kind === 'snow') {
      g.fillStyle = '#ffffff'; g.beginPath(); g.arc(x, y, p.size, 0, 7); g.fill();
    } else if (p.kind === 'dot') {
      g.fillStyle = p.color; g.beginPath(); g.arc(x, y, Math.max(0.5, p.size * (1 - k * 0.6)), 0, 7); g.fill();
    } else if (p.kind === 'bubble') {
      g.strokeStyle = 'rgba(190,230,255,.9)'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, p.size * pop, 0, 7); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(x - p.size * 0.35, y - p.size * 0.35, p.size * 0.22, 0, 7); g.fill();
    }
    g.restore();
  }
}

// -------------------------------------------------------------- drawing ----
function backHair(t) {
  const H = S.hair, sway = Math.sin(t * 1.3) * 3;
  g.fillStyle = shade(H, -0.18);
  g.beginPath();
  g.moveTo(200, 50);
  g.bezierCurveTo(60, 50, 40, 200, 58, 330);
  g.bezierCurveTo(66, 390, 70 + sway, 430, 92 + sway, 452);
  g.quadraticCurveTo(110 + sway, 420, 128, 430);
  g.lineTo(272, 430);
  g.quadraticCurveTo(290 - sway, 420, 308 - sway, 452);
  g.bezierCurveTo(330 - sway, 430, 334, 390, 342, 330);
  g.bezierCurveTo(360, 200, 340, 50, 200, 50);
  g.fill();
}

function body(t) {
  const O = S.outfit, breathe = Math.sin(t * 1.6) * 2;
  g.save(); g.translate(0, -12);
  // hood behind the neck
  g.fillStyle = shade(O, -0.07);
  g.beginPath(); g.ellipse(200, 408 + breathe, 78, 26, 0, Math.PI, 0); g.fill();
  g.strokeStyle = rgba(S.hair, 0.35); g.lineWidth = 2; g.stroke();
  // neck
  g.fillStyle = SKIN;
  g.fillRect(178, 320, 44, 100);
  g.fillStyle = SKIN2;
  g.beginPath(); g.moveTo(178, 345); g.quadraticCurveTo(200, 372, 222, 345); g.lineTo(222, 330); g.lineTo(178, 330); g.fill();
  // hoodie
  const grd = g.createLinearGradient(0, 390, 0, LH);
  grd.addColorStop(0, O); grd.addColorStop(1, shade(O, -0.1));
  g.fillStyle = grd;
  g.beginPath();
  g.moveTo(52, LH + 2);
  g.bezierCurveTo(56, 452 + breathe, 96, 412 + breathe, 168, 398 + breathe);
  g.quadraticCurveTo(200, 424 + breathe, 232, 398 + breathe);
  g.bezierCurveTo(304, 412 + breathe, 344, 452 + breathe, 348, LH + 2);
  g.closePath(); g.fill();
  g.strokeStyle = shade(O, -0.22); g.lineWidth = 2.5; g.stroke();
  // collar trim in the hair colour
  g.strokeStyle = rgba(S.hair, 0.9); g.lineWidth = 6; g.lineCap = 'round';
  g.beginPath(); g.moveTo(168, 400 + breathe); g.quadraticCurveTo(200, 428 + breathe, 232, 400 + breathe); g.stroke();
  // drawstrings
  g.strokeStyle = shade(O, -0.3); g.lineWidth = 3;
  for (const x of [186, 214]) {
    g.beginPath(); g.moveTo(x, 418 + breathe); g.quadraticCurveTo(x + (x < 200 ? -3 : 3), 450, x + (x < 200 ? -2 : 2), 476 + breathe); g.stroke();
    g.fillStyle = rgba(S.hair, 1); g.beginPath(); g.arc(x + (x < 200 ? -2 : 2), 480 + breathe, 4, 0, 7); g.fill();
  }
  // glowing heart badge: grows with love
  const pulse = 1 + Math.sin(t * (2 + S.love / 30)) * 0.08, r = (8 + S.love / 14) * pulse;
  const gl = g.createRadialGradient(262, 470 + breathe, 1, 262, 470 + breathe, r * 2.6);
  gl.addColorStop(0, 'rgba(255,111,159,.55)'); gl.addColorStop(1, 'rgba(255,111,159,0)');
  g.fillStyle = gl; g.beginPath(); g.arc(262, 470 + breathe, r * 2.6, 0, 7); g.fill();
  heartPath(262, 468 + breathe, r); g.fillStyle = '#ff6f9f'; g.fill();
  g.restore();
}

function facePath(puff) {
  const p = puff * 8;
  g.beginPath();
  g.moveTo(200, 352);
  g.bezierCurveTo(158, 350, 104 - p, 312, 94 - p, 250);
  g.bezierCurveTo(84, 180, 110, 104, 200, 100);
  g.bezierCurveTo(290, 104, 316, 180, 306 + p, 250);
  g.bezierCurveTo(296 + p, 312, 242, 350, 200, 352);
  g.closePath();
}

function eye(cx, cy, side, o, kind, lx, ly) {
  const E = S.eyes, boy = S.character === 'wizard', lw = boy ? 4.5 : 5;
  g.save();
  g.lineCap = 'round'; g.lineJoin = 'round';
  // closed / happy shapes
  if (kind === 'closed' || (o < 0.12 && kind !== 'heart')) {
    g.strokeStyle = LINE; g.lineWidth = lw;
    g.beginPath();
    if (kind === 'closed') {            // ^  ^  happy closed eyes
      g.moveTo(cx - 26, cy + 6); g.quadraticCurveTo(cx, cy - 22, cx + 26, cy + 6);
    } else {                            // blink: soft curve down
      g.moveTo(cx - 28, cy); g.quadraticCurveTo(cx, cy + 12, cx + 28, cy);
      g.moveTo(cx + side * 28, cy); g.lineTo(cx + side * 34, cy - 5);
    }
    g.stroke(); g.restore(); return;
  }
  const outer = { x: cx + side * 33, y: cy + 4 }, inner = { x: cx - side * 28, y: cy + 1 };
  const top = 40 * o, bot = 34 * o;
  // eye opening
  g.beginPath();
  g.moveTo(outer.x, outer.y);
  g.bezierCurveTo(cx + side * 30, cy - top, cx - side * 18, cy - top - 2, inner.x, inner.y);
  g.bezierCurveTo(cx - side * 18, cy + bot, cx + side * 24, cy + bot, outer.x, outer.y);
  g.closePath();
  g.fillStyle = '#ffffff'; g.fill();
  g.save(); g.clip();
  // iris
  const ix = cx + lx, iy = cy + 5 + ly;
  const gr = g.createLinearGradient(0, iy - 32, 0, iy + 30);
  gr.addColorStop(0, shade(E, -0.65)); gr.addColorStop(0.55, E); gr.addColorStop(1, shade(E, 0.45));
  g.fillStyle = gr;
  g.beginPath(); g.ellipse(ix, iy, 23, 31, 0, 0, 7); g.fill();
  g.strokeStyle = shade(E, -0.55); g.lineWidth = 2; g.stroke();
  if (kind === 'heart') {
    heartPath(ix, iy + 2, 15); g.fillStyle = '#ff4f8b'; g.fill();
  } else {
    g.fillStyle = shade(E, -0.75);
    g.beginPath(); g.ellipse(ix, iy + 1, 10, 14, 0, 0, 7); g.fill();
  }
  // shines
  g.fillStyle = '#fff';
  if (kind === 'sparkle') { star(ix - 8, iy - 11, 12, 4, 0.3); g.fill(); star(ix + 9, iy + 13, 6, 4, 0.3); g.fill(); }
  else {
    g.beginPath(); g.ellipse(ix - 8, iy - 12, 8, 10, -0.3, 0, 7); g.fill();
    g.beginPath(); g.arc(ix + 9, iy + 14, 4, 0, 7); g.fill();
  }
  // soft shadow from the upper lid
  g.fillStyle = 'rgba(80,40,90,.18)';
  g.beginPath(); g.ellipse(cx, cy - top + 4, 40, 12, 0, 0, 7); g.fill();
  g.restore();
  // upper lashes with a little wing
  g.strokeStyle = LINE; g.lineWidth = lw + 1;
  g.beginPath();
  g.moveTo(outer.x + side * 4, outer.y - 2);
  g.bezierCurveTo(cx + side * 30, cy - top - 2, cx - side * 18, cy - top - 4, inner.x, inner.y - 1);
  g.stroke();
  if (!boy) {
    g.lineWidth = 4;
    g.beginPath(); g.moveTo(outer.x, outer.y - 4); g.lineTo(outer.x + side * 9, outer.y - 10); g.stroke();
    // lower lash (outer half)
    g.lineWidth = 2;
    g.beginPath(); g.moveTo(outer.x - side * 2, outer.y + 2); g.quadraticCurveTo(cx + side * 16, cy + bot + 2, cx, cy + bot); g.stroke();
  }
  // angry: lid slanting to the middle / half: sleepy lid
  if (kind === 'angry' || kind === 'half') {
    g.fillStyle = SKIN;
    g.beginPath();
    if (kind === 'angry') { g.moveTo(outer.x + side * 6, cy - top - 8); g.lineTo(inner.x - side * 4, cy - top - 8); g.lineTo(inner.x - side * 4, cy - 2); g.lineTo(outer.x + side * 6, cy - top + 6); }
    else { g.rect(cx - 40, cy - top - 10, 80, top * 0.75 + 10); }
    g.fill();
    g.strokeStyle = LINE; g.lineWidth = lw;
    g.beginPath();
    if (kind === 'angry') { g.moveTo(outer.x + side * 4, cy - top + 6); g.lineTo(inner.x, cy - 2); }
    else { g.moveTo(cx - 34, cy - top * 0.25); g.quadraticCurveTo(cx, cy - top * 0.25 + 4, cx + 34, cy - top * 0.25); }
    g.stroke();
  }
  g.restore();
}

function brows(lift, ang) {
  g.save();
  g.strokeStyle = shade(S.hair, -0.45); g.lineWidth = 5; g.lineCap = 'round'; g.globalAlpha = 0.9;
  for (const side of [-1, 1]) {
    const cx = 200 + side * 52, y = 190 - lift * 9;
    const innerY = y + ang * 7, outerY = y - ang * 3;
    g.beginPath();
    g.moveTo(cx - side * 22, innerY);
    g.quadraticCurveTo(cx, y - 7, cx + side * 22, outerY + 4);
    g.stroke();
  }
  g.restore();
}

function mouth(kind, m) {
  const x = 200, y = 316;
  g.save();
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = LINE; g.lineWidth = 3;
  const inside = '#7a2a44', tongue = '#ff8fa7';
  if (m > 0.05) kind = 'talk';
  switch (kind) {
    case 'talk': {
      const w = 9 + m * 5, h = 3 + m * 13;
      g.fillStyle = inside; g.beginPath(); g.ellipse(x, y + h * 0.3, w, h, 0, 0, 7); g.fill(); g.stroke();
      g.save(); g.beginPath(); g.ellipse(x, y + h * 0.3, w, h, 0, 0, 7); g.clip();
      g.fillStyle = tongue; g.beginPath(); g.ellipse(x, y + h * 1.1, w * 0.8, h * 0.6, 0, 0, 7); g.fill(); g.restore();
      break;
    }
    case 'grin':
    case 'open': {
      const h = kind === 'open' ? 20 : 14;
      g.fillStyle = inside;
      g.beginPath(); g.moveTo(x - 16, y - 2); g.quadraticCurveTo(x, y + 2, x + 16, y - 2); g.quadraticCurveTo(x, y + h * 1.4, x - 16, y - 2); g.closePath(); g.fill(); g.stroke();
      g.save(); g.clip(); g.fillStyle = tongue; g.beginPath(); g.ellipse(x, y + h, 11, 7, 0, 0, 7); g.fill(); g.restore();
      break;
    }
    case 'cat':
      g.beginPath(); g.moveTo(x - 14, y - 2); g.quadraticCurveTo(x - 7, y + 8, x, y); g.quadraticCurveTo(x + 7, y + 8, x + 14, y - 2); g.stroke();
      break;
    case 'o':
      g.fillStyle = inside; g.beginPath(); g.ellipse(x, y + 4, 7, 9, 0, 0, 7); g.fill(); g.stroke();
      break;
    case 'frown':
      g.beginPath(); g.moveTo(x - 11, y + 6); g.quadraticCurveTo(x, y - 4, x + 11, y + 6); g.stroke();
      break;
    case 'pout':
      g.beginPath(); g.moveTo(x - 9, y + 4); g.quadraticCurveTo(x - 4, y - 2, x, y + 2); g.quadraticCurveTo(x + 4, y - 2, x + 9, y + 4); g.stroke();
      break;
    case 'wavy':
      g.beginPath(); g.moveTo(x - 14, y + 2);
      for (let i = 0; i < 4; i++) g.quadraticCurveTo(x - 10.5 + i * 7, y + (i % 2 ? 6 : -4), x - 7 + i * 7, y + 2);
      g.stroke(); break;
    case 'small':
      g.beginPath(); g.moveTo(x - 6, y + 1); g.quadraticCurveTo(x, y + 4, x + 6, y + 1); g.stroke();
      break;
    case 'flat':
      g.beginPath(); g.moveTo(x - 9, y + 2); g.lineTo(x + 9, y + 1); g.stroke();
      break;
    case 'tongue':
      g.beginPath(); g.moveTo(x - 15, y - 1); g.quadraticCurveTo(x, y + 10, x + 15, y - 1); g.stroke();
      g.fillStyle = tongue; g.beginPath(); g.ellipse(x + 5, y + 8, 6, 7, 0, 0, Math.PI); g.fill(); g.stroke();
      break;
    case 'puff':
      g.fillStyle = inside; g.beginPath(); g.ellipse(x, y + 2, 4, 5, 0, 0, 7); g.fill();
      break;
    default:     // smile
      g.beginPath(); g.moveTo(x - 13, y); g.quadraticCurveTo(x, y + 9, x + 13, y); g.stroke();
  }
  g.restore();
}

function blush(a) {
  if (a < 0.02) return;
  for (const side of [-1, 1]) {
    const x = 200 + side * 70, y = 288;
    const gr = g.createRadialGradient(x, y, 2, x, y, 30);
    gr.addColorStop(0, `rgba(255,120,150,${0.55 * a})`); gr.addColorStop(1, 'rgba(255,120,150,0)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, 32, 18, 0, 0, 7); g.fill();
    if (a > 0.6) {
      g.strokeStyle = `rgba(230,80,120,${(a - 0.6) * 2})`; g.lineWidth = 2; g.lineCap = 'round';
      for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(x - 12 + i * 9, y + 6); g.lineTo(x - 6 + i * 9, y - 5); g.stroke(); }
    }
  }
}

function frontHair(t) {
  const H = S.hair, sway = Math.sin(t * 1.3) * 3;
  const grd = g.createLinearGradient(0, 50, 0, 240);
  grd.addColorStop(0, shade(H, 0.12)); grd.addColorStop(1, shade(H, -0.08));
  // side locks framing the face
  g.fillStyle = grd;
  for (const side of [-1, 1]) {
    const sx = 200 + side * 112;
    g.beginPath();
    g.moveTo(sx - side * 6, 150);
    g.bezierCurveTo(sx + side * 14, 230, sx + side * 4, 330, sx - side * 8 + side * sway, 392);
    g.quadraticCurveTo(sx - side * 18, 340, sx - side * 30, 250);
    g.quadraticCurveTo(sx - side * 30, 200, sx - side * 22, 150);

const SP = { name: '', t0: -99, dur: 0, last: 0 };

// ------------------------------------------------------------ main loop -----
let last = performance.now();
function current() {
  if (A.touchPet || S.petting) return 'pet';
  if (SP.name) return SP.name === 'dream' ? 'sleepy' : SP.name === 'fade' ? 'wink' : 'excited';
  if (A.t - A.pokeT < 1.3) return 'pout';
  if (S.listening) return 'listening';
  if (S.thinking) return 'thinking';
  if (A.emoUntil && A.t > A.emoUntil) { S.emotion = S.mood; A.emoUntil = 0; }
  if (A.idle === 'yawn' && A.t - A.idleStart < 2.2) return 'sleepy';
  return EX[S.emotion] ? S.emotion : 'neutral';
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // the view can get its real size after the page loaded
  if (Math.round(innerWidth * (window.devicePixelRatio || 1)) !== cv.width || Math.round(innerHeight * (window.devicePixelRatio || 1)) !== cv.height) resize();
  if (cv.width < 2 || cv.height < 2) return;
  const t = (A.t += dt);
  const wiz = S.character === 'wizard';
  const name = current(), e = EX[name];

  // --- animation targets
  const ease = (v, to, k) => v + (to - v) * Math.min(1, k * dt);
  // gaze: finger > person (sensors) > random glances
  if (A.pointer) { A.tlx = (A.pointer.x - 200) / 14; A.tly = (A.pointer.y - 240) / 22; }
  else if (name === 'thinking') { A.tlx = -9; A.tly = -9; }
  else if (name === 'shy') { A.tlx = 7; A.tly = 8; }
  else if (t > A.nextGlance) {
    A.nextGlance = t + 1.2 + Math.random() * 3;
    const base = S.person ? S.lookX * 10 : 0;
    A.tlx = Math.random() < 0.55 ? base : base + (Math.random() - 0.5) * 18;
    A.tly = Math.random() < 0.55 ? 0 : (Math.random() - 0.5) * 8;
  }
  A.tlx = Math.max(-11, Math.min(11, A.tlx)); A.tly = Math.max(-9, Math.min(8, A.tly));
  A.lx = ease(A.lx, A.tlx, 10); A.ly = ease(A.ly, A.tly, 10);
  // blink
  if (t > A.blinkAt) { A.blinkT = t; A.blinkAt = t + 2 + Math.random() * 3.5; if (Math.random() < 0.2) A.blinkAt = t + 0.3; }
  const bt = t - A.blinkT;
  const blink = bt >= 0 && bt < 0.16 ? 1 - Math.sin(Math.PI * bt / 0.16) : 1;
  let openT = e.eyes === 'wide' ? 1.15 : e.eyes === 'half' ? 0.8 : e.eyes === 'down' ? 0.85 : 1;
  if (S.sleepy && name === 'neutral') openT = 0.75;
  A.open = ease(A.open, openT, 12);
  // lip sync: random syllables while talking, a pop on every new word
  let tm = 0;
  if (S.speaking) tm = 0.25 + 0.75 * Math.abs(Math.sin(t * 17 + Math.sin(t * 5) * 2)) * (0.6 + 0.4 * Math.sin(t * 3.1));
  if (t - A.wordT < 0.12) tm = Math.max(tm, 0.9);
  A.mouth = ease(A.mouth, tm, 22);
  A.blush = ease(A.blush, Math.max(e.blush, S.love > 80 ? 0.4 : 0), 4);
  // head tilt + bounce + idle sway
  let tilt = e.tilt + Math.sin(t * 0.7) * 2;
  if (A.touchPet || S.petting) tilt += Math.sin(t * 4.5) * 4;            // leans into the hand
  A.tilt = ease(A.tilt, tilt, 5);
  const bounce = e.bounce ? Math.abs(Math.sin(t * 7)) * 8 : 0;
  const tap = Math.max(0, 1 - (t - A.tapT) * 3) * Math.sin((t - A.tapT) * 30) * 6;
  A.petHand = ease(A.petHand, A.touchPet || S.petting ? 1 : 0, 6);
  if (S.petting && !A.touchPet) A.handX = 200 + Math.sin(t * 4.5) * 50;

  // idle moments: yawn when sleepy, hum when happy, look around
  if (!S.speaking && !S.listening && !S.thinking && t > A.idleT) {
    A.idleT = t + 8 + Math.random() * 10;
    A.idleStart = t;
    A.idle = S.sleepy ? 'yawn' : (S.love > 50 && Math.random() < 0.4 ? 'hum' : 'look');
    if (A.idle === 'look') { A.tlx = -11; setTimeout(() => (A.tlx = 11), 700); setTimeout(() => (A.tlx = 0), 1500); A.nextGlance = t + 2; }
  }

  // --- draw
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  sky(t, cv.width / DPR, cv.height / DPR);
  g.translate(OX, OY); g.scale(SC, SC);
  const sp = spellProgress();
  if (sp >= 0) spellBackground(sp, cv.width / DPR, cv.height / DPR);
  // soft glow behind the character
  const gc = wiz ? S.hat : S.hair;
  const glow = g.createRadialGradient(200, 230, 20, 200, 250, 260);
  glow.addColorStop(0, rgba(gc, 0.35)); glow.addColorStop(1, rgba(gc, 0));
  g.fillStyle = glow; g.fillRect(-200, -100, 800, 800);

  const breathe = Math.sin(t * 1.6) * 2;
  const lift = sp >= 0 && SP.name === 'float' ? Math.sin(Math.PI * sp) * 48 : 0;
  const cast = sp >= 0 ? Math.max(0, 1 - (t - SP.t0) / 1.0) : 0;
  g.save();
  if (sp >= 0 && SP.name === 'fade') g.globalAlpha = 1 - 0.85 * Math.sin(Math.PI * sp);
  g.translate(tap, -bounce - lift + charOffset());
  // head group rotates around the neck
  const headY = breathe * 0.6;
  g.save(); g.translate(200, 360 + headY); g.rotate(A.tilt * Math.PI / 180); g.translate(-200, -360);
  if (wiz) wizBackHair(); else backHair(t);
  g.restore();
  if (wiz) wizBody(t); else body(t);
  g.save(); g.translate(200, 360 + headY); g.rotate(A.tilt * Math.PI / 180); g.translate(-200, -360);
  // face
  const puff = name === 'pout' ? Math.min(1, (t - A.pokeT) * 6) : 0;
  facePath(puff);
  const fg = g.createLinearGradient(0, 120, 0, 352);
  fg.addColorStop(0, SKIN); fg.addColorStop(1, '#ffdccd');
  g.fillStyle = fg; g.fill();
  g.strokeStyle = '#e8b4a3'; g.lineWidth = 2; g.stroke();
  blush(A.blush);
  // eyes
  const o = A.open * blink;
  for (const side of [-1, 1]) {
    let kind = e.eyes;
    if (kind === 'wink' && side === 1) kind = 'closed';
    else if (kind === 'wink') kind = 'normal';
    if (kind === 'down' || kind === 'up') kind = 'normal';
    eye(200 + side * 52, 250, side, o, kind, A.lx, A.ly);
  }
  // nose
  g.strokeStyle = '#e0a593'; g.lineWidth = 2.5; g.lineCap = 'round';
  g.beginPath(); g.moveTo(203, 287); g.lineTo(200, 293); g.stroke();
  mouth(e.mouth, A.mouth);
  if (wiz) {
    wizHair(t);
    brows(e.lift, e.ang);
    wizHat(t, A.petHand * (0.5 + 0.5 * Math.sin(t * 9)));
  } else {
    // soft shadow of the bangs on her forehead
    g.save(); facePath(puff); g.clip(); g.translate(0, 9); g.globalAlpha = 0.16;
    const keepHair = S.hair; S.hair = '#5a3b6e'; frontHair(t); S.hair = keepHair;
    g.restore();
    frontHair(t);
    brows(e.lift, e.ang);
  }
  if (e.fx && ['anger', 'tear', 'bang', 'dots'].includes(e.fx)) headFx(e.fx, t);
  if (name === 'listening') headFx('listen', t);
  if (A.idle === 'yawn' && t - A.idleStart < 2.2) { /* sleepy face shown */ }
  g.restore();
  let tip = [200, 60];
  if (wiz) { tip = wizWand(t, cast); wisp(t, dt); }
  if (A.petHand > 0.02) petHand(A.handX, A.petHand, wiz ? 34 : 62);
  g.restore();
  tip = [tip[0] + tap, tip[1] - bounce - lift + charOffset()];
  if (sp >= 0) spellEffects(sp, dt, tip);
  if (sp >= 0 && SP.name === 'starburst' && t - SP.t0 < 0.35) {            // flash
    g.fillStyle = 'rgba(255,250,220,' + (0.6 * (1 - (t - SP.t0) / 0.35)) + ')'; g.fillRect(-200, -200, 800, 1000);
  }
  if (wiz && name === 'pet' && Math.random() < dt * 5) spawn('gstar', 120 + Math.random() * 160, 120, (Math.random() - 0.5) * 40, -60, 1.6, 7 + Math.random() * 5);

  if (e.fx) fx(e.fx, t, dt);
  if (A.idle === 'hum' && t - A.idleStart < 3) fx('notes', t, dt);
  drawParticles(dt);
  if (!A.ready) { A.ready = true; try { if (window.AndroidBridge) AndroidBridge.ready(); } catch (er) {} }
}
requestAnimationFrame(frame);

// -------------------------------------------------------------- touches ----
function toLocal(ev) { return { x: (ev.clientX - OX) / SC, y: (ev.clientY - OY) / SC - charOffset() }; }
function tell(kind) { try { window.AndroidBridge && AndroidBridge.touch(kind); } catch (e) {} }
let downAt = null, rubbed = 0;
cv.addEventListener('pointerdown', ev => {
  const p = toLocal(ev); A.pointer = p; downAt = { x: p.x, y: p.y, t: A.t }; rubbed = 0;
  if (p.y < 175 && p.x > 60 && p.x < 340) { A.touchPet = true; A.handX = p.x; tell('pat_start'); }
});
cv.addEventListener('pointermove', ev => {
  if (!A.pointer) return;
  const p = toLocal(ev);
  if (A.touchPet) { rubbed += Math.abs(p.x - A.pointer.x); A.handX = p.x; }
  A.pointer = p;
});
function up() {
  if (!downAt) return;
  const p = A.pointer || downAt, held = A.t - downAt.t;
  if (A.touchPet) { A.touchPet = false; tell(rubbed > 40 || held > 0.6 ? 'pat_end' : 'pat_tap'); }
  else if (held < 0.5) {
    if (p.y > 250 && p.y < 345 && Math.abs(p.x - 200) > 35 && Math.abs(p.x - 200) < 115) { A.pokeT = A.t; tell('poke'); }
    else if (p.y > 200 && p.y < 345 && Math.abs(p.x - 200) < 110) { A.tapT = A.t; A.blinkT = A.t; tell('boop'); }
    else if (p.y > 380) { A.tapT = A.t; tell('tap_body'); }
  }
  A.pointer = null; downAt = null;
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', up);
cv.addEventListener('pointerleave', up);

// ------------------------------------------------------- API for the app ---
window.Avatar = {
  /** {speaking, listening, thinking, petting, love, lookX, person, sleepy, hair, eyes, mood} */
  set(o) {
    Object.assign(S, o);
    if (o.mood && !A.emoUntil) S.emotion = o.mood;
  },
  /** Show a feeling; after `sec` seconds she goes back to her mood (0 = keep). */
  emotion(name, sec) {
    if (!EX[name]) name = 'neutral';
    S.emotion = name; A.emoT = A.t;
    A.emoUntil = sec > 0 ? A.t + sec : 0;
    if (name === 'love' || name === 'excited') for (let i = 0; i < 5; i++) fx(name === 'love' ? 'hearts' : 'sparkles', A.t, 1);
  },
  word() { A.wordT = A.t; },
  /** starburst, float, rainbow, snow, fireworks, bubbles, fade, dream */
  spell(name) {
    if (!SPELLS[name]) name = 'starburst';
    SP.name = name; SP.t0 = A.t; SP.dur = SPELLS[name]; SP.last = 0;
  },
  hearts(n) { for (let i = 0; i < (n || 6); i++) spawn('heart', 110 + Math.random() * 180, 220 + Math.random() * 60, (Math.random() - 0.5) * 40, -80, 1.8, 10 + Math.random() * 10); },
};
</script>
</body>
