; PlatformIO build for VoiceAI. Arduino IDE users: just open VoiceAI/VoiceAI.ino
; (needs the "esp32 by Espressif" board package 3.x and the libraries below).
[platformio]
src_dir = VoiceAI
default_envs = esp32dev

[env]
; pioarduino = Arduino-ESP32 core 3.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps =
  ESP32Async/AsyncTCP@^3.4.0
  ESP32Async/ESPAsyncWebServer@^3.7.0
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit GFX Library@^1.12.0
  adafruit/Adafruit BusIO@^1.16.0
  adafruit/Adafruit SSD1327@^1.0.4
  adafruit/Adafruit SSD1351 library@^1.3.0
  adafruit/Adafruit SH110X@^2.1.10

; 1.5" SH1107 white I2C OLED (default)
[env:esp32dev]
build_flags = ${env.build_flags} -DOLED_TYPE=3

; 1.5" SSD1327 grayscale I2C OLED
[env:oled_gray]
build_flags = ${env.build_flags} -DOLED_TYPE=1

; 1.5" SSD1351 colour SPI OLED
[env:oled_color]
build_flags = ${env.build_flags} -DOLED_TYPE=2

; SH1107 + a second ultrasonic sensor for left / right eye tracking
[env:two_sensors]
build_flags = ${env.build_flags} -DOLED_TYPE=3 -DULTRA2_TRIG=32 -DULTRA2_ECHO=33

; no display
[env:no_oled]
build_flags = ${env.build_flags} -DOLED_TYPE=0
