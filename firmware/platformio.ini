; PlatformIO build for VoiceAI. Arduino IDE users: just open VoiceAI/VoiceAI.ino
; (needs the "esp32 by Espressif" board package 3.x and the libraries below).
[platformio]
src_dir = VoiceAI

[env:esp32dev]
; pioarduino = Arduino-ESP32 core 3.x (needed for the IDF5 DAC driver)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -DCORE_DEBUG_LEVEL=1
lib_deps =
  ESP32Async/AsyncTCP@^3.4.0
  ESP32Async/ESPAsyncWebServer@^3.7.0
  bblanchon/ArduinoJson@^7.2.0
  earlephilhower/ESP8266Audio@^2.4.1
  earlephilhower/ESP8266SAM@^1.1.0
