name: Build ESP32 firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/build-firmware.yml"]
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Compile
        shell: bash
        run: |
          set +e
          pio run -d firmware 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            # show compiler errors as annotations on the run page
            grep -E "error:|Error |\*\*\*" build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            tail -8 build.log | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceAI-firmware
          path: |
            firmware/.pio/build/esp32dev/firmware.bin
            firmware/.pio/build/esp32dev/bootloader.bin
            firmware/.pio/build/esp32dev/partitions.bin
