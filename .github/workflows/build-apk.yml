name: Build Android APK

on:
  push:
    paths: ["app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The Android SDK is already installed on GitHub's Ubuntu runners
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - name: Build APK
        shell: bash
        run: |
          set +e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -E "error:|What went wrong|FAILURE|> " ../gradle.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceAI-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      # Also publish the APK on the "apk" branch so it can be downloaded
      # directly: github.com/<you>/esp32-voice-ai/raw/apk/VoiceAI.apk
      - name: Publish APK to apk branch
        if: github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          mkdir -p /tmp/out && cp app/android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/VoiceAI.apk
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add VoiceAI.apk
          git commit -qm "VoiceAI APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
