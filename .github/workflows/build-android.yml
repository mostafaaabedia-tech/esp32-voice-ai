name: Build Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Gradle 8.11.1 (no wrapper jar needed in the repo)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # offline speech engine + voice packs (not stored in git, ~120 MB)
      - uses: actions/cache@v4
        with:
          path: |
            android/app/libs
            android/app/src/main/assets/asr
            android/app/src/main/assets/tts
          key: offline-models-${{ hashFiles('android/fetch_models.sh') }}
      - name: Get offline voice models
        run: bash android/fetch_models.sh

      - name: Build APK
        shell: bash
        working-directory: android
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            # Kotlin errors start with "e: ", show them on the run page
            grep -E "^e: |What went wrong|error:|> Could not|AAPT" ../gradle.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceAI-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Publish on the "apk" branch: github.com/<you>/esp32-voice-ai/raw/apk/VoiceAI.apk
      - name: Publish APK to apk branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/out
          # VoiceAI.apk = most phones (64-bit). VoiceAI-32bit.apk = older / cheaper phones.
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk /tmp/out/VoiceAI.apk
          cp android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk /tmp/out/VoiceAI-32bit.apk
          ls -la /tmp/out
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add VoiceAI.apk VoiceAI-32bit.apk
          git commit -qm "VoiceAI APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
